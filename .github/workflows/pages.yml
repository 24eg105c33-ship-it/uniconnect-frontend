name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Point the site at your deployed backend. Set the repository variable
      # API_URL (Settings -> Secrets and variables -> Actions -> Variables),
      # e.g. https://uniconnect-backend.onrender.com/api
      - name: Inject backend URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            printf 'window.UNI_CONFIG = { API_URL: "%s" };\n' "$API_URL" > config.js
          fi
          mkdir _site
          cp index.html styles.css app.js config.js _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
